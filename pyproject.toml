[project]
name = "pudufu-recorder"
version = "0.1.0"
description = "프드프(pudufu.co.kr) 내 강의를 1.5배속 영상으로 저장하는 데스크톱 앱"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "thsvkd" }]

dependencies = [
    # flet 버전은 고정한다. flet build가 번들용 flet을 따로 설치하는데
    # flet-cli와 버전이 어긋나면 앱 창이 비어 보이는 문제가 생긴다.
    "flet==0.86.5",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/thsvkd/pudufu-recorder"

[dependency-groups]
dev = ["flet-cli==0.86.5"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pudufu"
module-root = ""

[tool.flet]
org = "com.thsvkd"
product = "프드프 강의 1.5배속 다운로더"
company = "thsvkd"
copyright = "Copyright (c) 2026 thsvkd"

[tool.flet.app]
module = "main"
