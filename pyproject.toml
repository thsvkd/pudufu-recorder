[project]
name = "pudufu-recorder"
version = "0.1.1"
description = "프드프(pudufu.co.kr) 내 강의를 1.5배속 영상으로 저장하는 데스크톱 앱"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "thsvkd" }]

dependencies = [
    # flet 버전은 고정한다. flet build가 번들용 flet을 따로 설치하는데
    # flet-cli와 버전이 어긋나면 앱 창이 비어 보이는 문제가 생긴다.
    "flet==0.86.5",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    # 설치/자동 업데이트(Velopack). abi3 네이티브 확장이라 flet이 임베드하는 파이썬
    # 버전과 무관하게 번들에 들어간다. import만으로 0.5초 이상 걸리므로 앱 기동 경로에서
    # 부르지 않는다(velopack_update가 함수 안에서 지연 임포트한다).
    "velopack>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/thsvkd/pudufu-recorder"

[dependency-groups]
dev = ["flet-cli==0.86.5"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pudufu"
module-root = ""

[tool.flet]
org = "com.thsvkd"
product = "프드프 강의 1.5배속 다운로더"
company = "thsvkd"
copyright = "Copyright (c) 2026 thsvkd"

[tool.flet.app]
module = "main"
# flet build는 프로젝트 폴더를 **통째로** 앱 안에 복사한다. 빼지 않으면 개발 환경이 그대로
# 사용자에게 배포된다 — v0.1.0에서 실제로 .env(프드프 계정 정보)가 공개 릴리스에 실려 나갔다.
# 이 목록만 믿지 않는다. scripts/build.py의 verify_no_secrets가 패키징 전에 산출물을 직접
# 뒤져 다시 막는다(이 설정이 비거나 매칭이 어긋나도 배포되지 않게).
exclude = [
    ".env",
    ".git",
    ".venv",
    ".omc",
    ".claude",
    ".ruff_cache",
    "__pycache__",
    "dist",
    "build",
    "recordings",
]
